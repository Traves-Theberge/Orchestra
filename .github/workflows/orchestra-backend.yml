name: orchestra-backend

on:
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'packages/protocol/**'
      - 'packages/test-fixtures/**'
      - '.github/workflows/orchestra-backend.yml'
      - '.github/scripts/check-orchestra-naming.sh'
  push:
    branches:
      - main
    paths:
      - 'apps/backend/**'
      - 'packages/protocol/**'
      - 'packages/test-fixtures/**'
      - '.github/workflows/orchestra-backend.yml'
      - '.github/scripts/check-orchestra-naming.sh'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOWORK: 'off'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Set up Go
        uses: ./.github/actions/setup-go-cached
        with:
          go-mod-path: apps/backend/go.mod
          go-sum-path: apps/backend/go.sum

      - name: Verify formatting
        shell: bash
        run: |
          test -z "$(gofmt -l ./cmd ./internal)"

      - name: Go vet
        run: go vet ./...

      - name: Run unit/integration tests
        run: go test -coverprofile coverage.out ./...

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: backend-coverage-${{ matrix.os }}
          path: apps/backend/coverage.out

  backend-race-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Set up Go
        uses: ./.github/actions/setup-go-cached
        with:
          go-mod-path: apps/backend/go.mod
          go-sum-path: apps/backend/go.sum

      - name: Run race tests
        run: go test -race ./...

  naming-guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Check Orchestra naming guard
        run: .github/scripts/check-orchestra-naming.sh
