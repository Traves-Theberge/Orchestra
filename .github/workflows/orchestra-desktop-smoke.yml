name: orchestra-desktop-smoke

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/backend/**'
      - 'packages/protocol/**'
      - 'packages/test-fixtures/**'
      - '.github/workflows/orchestra-desktop-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/desktop/**'
      - 'apps/backend/**'
      - 'packages/protocol/**'
      - 'packages/test-fixtures/**'
      - '.github/workflows/orchestra-desktop-smoke.yml'
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up Node
        uses: ./.github/actions/setup-node-cached
        with:
          cache-dependency-path: apps/desktop/package-lock.json
          node-version: 22

      - name: Set up Go
        uses: ./.github/actions/setup-go-cached
        with:
          go-mod-path: apps/backend/go.mod
          go-sum-path: apps/backend/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test renderer
        run: npm run test

      - name: Test evidence gate
        run: node --test scripts/release-readiness.test.mjs

      - name: Build renderer
        run: npm run build

      - name: API smoke with backend
        run: npm run smoke:ops:go

      - name: Build native Windows backend
        if: runner.os == 'Windows'
        run: go build -o orchestrad.exe ./cmd/orchestrad/
        working-directory: apps/backend

      - name: Native Windows Electron smoke
        if: runner.os == 'Windows'
        run: npm run smoke:electron

      - name: Upload verification reports when produced
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: orchestra-desktop-release-readiness-report-${{ matrix.os }}
          path: apps/desktop/reports
          if-no-files-found: ignore
